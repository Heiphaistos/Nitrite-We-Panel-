name: Web Panel (NiTriTe Agent)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent:
    name: Build NiTriTe Agent (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            upstream/package-lock.json
      # L'interface de NiTriTe (src/) se resout depuis node_modules a la racine.
      - run: npm ci
      - run: npm ci
        working-directory: .
      - name: Version de l'agent alignee sur NiTriTe
        shell: bash
        run: bash scripts/sync-version.sh --check
      - name: Tests des cales JS
        run: npm test
        working-directory: .
      - name: Build de l'interface web
        run: npm run build
        working-directory: .
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Tests de l'agent
        working-directory: agent
        run: cargo test -p tauri -p nitrite-agent
      - name: Build release
        working-directory: agent
        run: cargo build --release -p nitrite-agent
      # Le vrai .exe sur un vrai Windows : securite, commandes WMI/registre,
      # WebSocket d'evenements, arret propre.
      - name: Test de fumee (exe release)
        working-directory: .
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -Exe agent/target/release/nitrite-agent.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NiTriTe-Agent
          path: agent/target/release/nitrite-agent.exe
          if-no-files-found: error
